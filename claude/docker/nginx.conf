server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # index.html must never be cached, or a deploy leaves clients on old asset
    # hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Without the Upgrade/Connection headers socket.io silently degrades to
    # long-polling. It works well enough to hide the misconfiguration, and it
    # presents as unexplained lag. See docs/62-docker-deploy.md §3.
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not cull idle sockets mid-round.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass http://server:3000/healthz;
    }

    # SPA fallback, last so it does not shadow the routes above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
