[package]
name = "game-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen shim over game-core. No logic of its own."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game-core = { workspace = true, features = ["serde"] }
wasm-bindgen.workspace = true
serde_json.workspace = true
console_error_panic_hook = "0.1"

[dev-dependencies]
# **Only so a test can cross the wire** (T20.21). T20.19's two fixtures set
# health directly on both sides and so bypassed `codec.rs`'s `as u8`, which is
# exactly why nobody caught that the mirror sits up to 1.0 health below the
# server. A test that re-implements the truncation proves the test's arithmetic,
# not the codec's, so `walk_both_sides` calls the real `encode_snapshot` /
# `decode_snapshot`. Dev-only: `wasm-pack` builds the lib target and never sees
# this, and the direction is the light one — `game-server` does not depend on
# `game-wasm`, so nothing here reaches the shipped artifact.
game-server = { path = "../game-server" }

# **No `wasm-bindgen-test`, deliberately (T19.19).** `scripts/check.sh` runs
# `cargo test --workspace` and no wasm runner, so a `#[wasm_bindgen_test]` in
# this crate compiles, reports nothing and never executes — which is how
# thirteen of them sat dark from M3 to M19. Without the dependency the attribute
# does not compile, and `no_test_in_this_crate_is_invisible_to_the_gate` says
# why for anyone who adds it back. Nothing here needs a browser: the crate
# mentions neither `js_sys` nor `web_sys`.
