[package]
name = "game-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure simulation core: map generation, destruction, physics, items, weapons, effects."

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
blake3.workspace = true
serde = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
# Turns on `test-support` for this crate's own integration tests (`tests/*.rs`),
# which link the library without `cfg(test)`.
game-core = { path = ".", features = ["test-support"] }

[features]
default = ["serde"]
serde = ["dep:serde"]
dump-png = ["dep:png"]
# `World::for_test`: a per-test-binary cache of generated maps. Never enabled by
# a shipping build. Only `[dev-dependencies]` turn it on.
test-support = []
