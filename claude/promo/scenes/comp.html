<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SHRED — scene compositor</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  #frame { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #black { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* The typed caption: the intro's terminal line (promo/intro/index.html #type), top left. */
  .type {
    position: absolute; left: 92px; top: 78px; opacity: 0;
    font-family: "Ubuntu Sans Mono", "DejaVu Sans Mono", monospace;
    font-size: 46px; font-weight: 600; letter-spacing: .14em; color: #e4fff3;
    text-shadow: 0 0 14px rgba(90, 255, 190, .45), 0 0 2px rgba(0, 0, 0, .9), 0 2px 10px rgba(0, 0, 0, .8);
    white-space: pre;
  }
  .type .pr { color: #5dffb0; margin-right: .5em; }
  .type .cur {
    display: inline-block; width: .62em; height: 1.02em; margin-left: .12em; vertical-align: -0.16em;
    background: #8dffcf; box-shadow: 0 0 12px rgba(90, 255, 190, .7);
  }
  /* The final scene's line: the same terminal, large and centred. */
  .type.center {
    left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font-size: 150px; font-weight: 700; letter-spacing: .12em;
    text-shadow: 0 0 34px rgba(90, 255, 190, .55), 0 0 4px rgba(0, 0, 0, .9), 0 4px 24px rgba(0, 0, 0, .9);
  }
  .type .ghost { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; mix-blend-mode: screen; }
</style>
</head>
<body>
<img id="frame" />
<div id="type" class="type"><span class="pr">&gt;</span><span class="txt"></span><span class="cur"></span></div>
<div id="black"></div>
<script type="module" src="./comp.js"></script>
</body>
</html>
