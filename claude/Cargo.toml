[workspace]
members = ["crates/game-core", "crates/game-server", "crates/game-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
game-core = { path = "crates/game-core" }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
socketioxide = { version = "0.18", features = ["state", "extensions", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
wasm-bindgen = "0.2"
png = "0.17"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
